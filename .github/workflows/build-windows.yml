name: Build Windows app
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.11.1
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TelegramProxy telegram_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramProxy-Windows
          path: dist/TelegramProxy.exe
          if-no-files-found: error
